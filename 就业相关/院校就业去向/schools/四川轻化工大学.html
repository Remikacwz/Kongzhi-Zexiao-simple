* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Helvetica Neue",Arial,sans-serif;
    background:#FFF5F5; color:#2d3436; line-height:1.7;
}
.header {
    background: linear-gradient(135deg, #FFAB91 0%, #FFCCBC 100%);
    color:#17191d; padding:30px 20px; text-align:center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
}
.header h1 { font-size:2em; margin-bottom:10px; font-weight:600; }
.badge {
    display:inline-block; padding:4px 14px; background:rgba(255,255,255,0.25);
    border-radius:20px; font-size:0.85em; margin:0 4px; backdrop-filter:blur(4px);
}
.back-btn {
    display:inline-flex; align-items:center; gap:8px; padding:10px 20px;
    background:white; border:2px solid #FFAB91; border-radius:25px; cursor:pointer;
    margin:20px; font-size:1em; text-decoration:none; transition:all 0.3s; font-weight:500;
}
.back-btn:hover { background:#FFAB91; color:#17191d; }
.container { width:80%; margin:0 auto; padding:0 20px 40px; }
.content-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:20px; margin-bottom:20px; }
.content-grid .section { margin-bottom:0; }
.full-width { grid-column:1 / -1; }
.section { background:white; border-radius:12px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
.section h2 { font-size:1.2em; color:#a92122; margin-bottom:14px; display:flex; align-items:center; gap:8px; }
.section p { font-size:0.95em; color:#3d3d3d; }
.source-note { margin-top:10px; font-size:0.82em; color:#8a8a8a; }
.college-list { list-style:none; padding:0; }
.college-list li {
    padding:10px 14px; background:#FFF5F5; border-radius:8px; margin-bottom:8px;
    font-size:0.95em; border-left:3px solid #FFAB91;
}
.college-list li:last-child { margin-bottom:0; }
.eval-badge {
    display:inline-block; padding:10px 24px; border-radius:12px; font-size:1.6em;
    font-weight:700; letter-spacing:2px;
    background:#FFF1F2; color:#a92122; border:2px solid #FECDD3;
}
.eval-empty { color:#8a8a8a; font-size:0.9em; }
.employer-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:8px; }
.employer-item {
    padding:8px 12px; background:#FFF5F5; border-radius:8px; font-size:0.85em;
    display:flex; align-items:center; gap:8px;
}
.employer-rank {
    width:20px; height:20px; line-height:20px; text-align:center; background:#FFAB91;
    color:#17191d; border-radius:50%; font-size:0.75em; font-weight:600; flex-shrink:0;
}
footer { text-align:center; padding:30px; color:#8a8a8a; font-size:0.85em; }
@media (max-width:768px) {
    .header h1 { font-size:1.4em; }
    .content-grid { grid-template-columns:1fr; }
    .container { width:100%; }
}
</style>
